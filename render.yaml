services:
  - type: web
    name: binance-scanner-pro
    runtime: python
    region: frankfurt          # ✅ EU server — Binance NOT blocked here
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
